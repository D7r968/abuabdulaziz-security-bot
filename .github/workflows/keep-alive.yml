name: Keep security bot awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: security-keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping bot health endpoint
        run: curl --fail --silent --show-error --max-time 30 https://abuabdulaziz-security-bot.onrender.com/
